    const { useState, useEffect, useMemo, useRef } = React;

    // Error Boundary to prevent any crash from blanking out the UI
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("UI Error caught by boundary:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-6 m-4 bg-red-50 border border-red-200 rounded-2xl text-red-900 space-y-2">
              <h3 className="font-bold text-sm">A minor display error occurred</h3>
              <p className="text-xs text-red-700">{this.state.error?.message || "Unknown error"}</p>
              <button
                onClick={() => this.setState({ hasError: false, error: null })}
                className="px-3 py-1 bg-red-600 text-white text-xs font-bold rounded-lg shadow-sm"
              >
                Reset View
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

        if (!ts) return "";
        try {

          return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });

        } catch (e) {
          console.error("Error loading STP data:", e);

        const created = c.created_at ? new Date(c.created_at) : new Date(nowRef.getTime() - 45 * 60000);
        const due = c.sla_due_at ? new Date(c.sla_due_at) : new Date(created.getTime() + 2 * 3600000);
        const elapsedMins = Math.max(1, Math.round((nowRef.getTime() - created.getTime()) / 60000));
        const targetMins = Math.max(15, Math.round((due.getTime() - created.getTime()) / 60000));

        if (c.status === "SETTLED") {
          const settled = c.settled_at ? new Date(c.settled_at) : new Date(created.getTime() + 35 * 60000);
          const resolveMins = Math.max(1, Math.round((settled.getTime() - created.getTime()) / 60000));
          const bufferMins = Math.round((due.getTime() - settled.getTime()) / 60000);
          if (bufferMins >= 0) {
            return {
              category: "SETTLED",
              label: `✓ SLA Met (${resolveMins}m)`,
              drawerLabel: `✓ SLA MET (Resolved in ${resolveMins}m — ${bufferMins}m buffer maintained)`,
              badge: "bg-emerald-50 text-emerald-800 border border-emerald-300 font-mono font-bold",
              isUrgent: false,
              isBreached: false,
              elapsedMins,
              targetMins
            };
          } else {
            return {
              category: "SETTLED",
              label: `⚠️ Resolved Late (+${Math.abs(bufferMins)}m)`,
              drawerLabel: `⚠️ SLA BREACHED (Resolved in ${resolveMins}m — ${Math.abs(bufferMins)}m past cutoff)`,
              badge: "bg-rose-50 text-rose-800 border border-rose-300 font-mono font-bold",
              isUrgent: false,
              isBreached: true,
              elapsedMins,
              targetMins
            };
          }
        }

        const diffMs = due.getTime() - nowRef.getTime();
        const diffMinutes = Math.round(diffMs / 60000);
        const diffHours = diffMs / (1000 * 3600);

        if (diffMs < 0) {
          const overdueMins = Math.abs(diffMinutes);
          return {
            category: "BREACHED",
            label: `⚠️ Overdue (${overdueMins}m)`,
            drawerLabel: `⚠️ SLA OVERDUE by ${overdueMins}m (Ingested ${elapsedMins}m ago | Target: ${targetMins}m)`,
            badge: "bg-rose-200 text-rose-900 border border-rose-400 font-bold animate-pulse font-mono",
            isUrgent: true,
            isBreached: true,
            hoursLeft: diffHours,
            diffMinutes,
            elapsedMins,
            targetMins
          };
        } else if (diffMinutes <= 60) {
          return {
            category: "CRITICAL_1H",
            label: `🔴 < ${diffMinutes}m remaining`,
            drawerLabel: `🔴 SLA CRITICAL: ${diffMinutes}m remaining (Ingested ${elapsedMins}m ago | Target: ${targetMins}m)`,
            badge: "bg-rose-100 text-rose-800 border border-rose-300 font-bold animate-pulse font-mono",
            isUrgent: true,
            isBreached: false,
            hoursLeft: diffHours,
            diffMinutes,
            elapsedMins,
            targetMins
          };
        } else if (diffHours <= 4.0) {

            category: "URGENT_4H",
            label: `🟡 ${hrs}h remaining`,
            drawerLabel: `🟡 SLA Approaching: ${hrs}h remaining (Ingested ${elapsedMins}m ago | Target: ${targetMins}m)`,

            isUrgent: false,
            isBreached: false,
            hoursLeft: diffHours,
            diffMinutes,
            elapsedMins,
            targetMins

            category: "NORMAL_24H",

                                      </div>

                                    {/* Before & After Proposed Field Repair */}
                                    <td className="px-3 py-3 text-xs">
                                      <div className="bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-1.5">
                                        <div className="text-[10px] font-mono font-bold text-indigo-700 truncate" title={item.original_field || "Document.CdtrAcct.Id"}>
                                          {item.original_field || "Field Repair"}
                                        </div>
                                        <div className="flex flex-wrap items-center gap-1.5 text-[11px] font-mono">
                                          <span className="line-through text-rose-700 bg-rose-50 px-1.5 py-0.5 rounded border border-rose-200" title="Original Erroneous Value">
                                            {item.original_value || "ORIGINAL_ERR"}
                                          </span>
                                          <span className="text-slate-400">&rarr;</span>
                                          <span className="font-bold text-emerald-800 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-300" title="AI Synthesized Repair">
                                            {item.proposed_value || item.proposed_repair_summary || "REPAIRED_VAL"}
                                          </span>
                                        </div>
                                        <div className="text-[10px] text-slate-500 leading-tight line-clamp-2" title={item.field_justification || item.reason}>
                                          {item.field_justification || item.reason}
                                        </div>
                                      </div>
                                    </td>

                                    {/* Policy & Sanctions Status */}
                                    <td className="px-3 py-3 whitespace-nowrap">
                                      <div className="space-y-1">
                                        <div>
                                          <span className="px-2 py-0.5 rounded text-[10px] font-mono font-semibold bg-slate-100 text-slate-700 border border-slate-200 block truncate max-w-[150px]" title={item.matching_rule_name || "STP Policy Heuristic"}>
                                            {item.matching_rule_name || "STP Policy Heuristic"}
                                          </span>
                                        </div>
                                        <div>
                                          <span className="px-2 py-0.5 rounded-full text-[9px] font-mono font-bold bg-emerald-50 text-emerald-700 border border-emerald-300">
                                            OFAC: {item.sanctions_status || "CLEAN ✓"}
                                          </span>
                                        </div>
                                      </div>
                                    </td>
                                  </tr>

                                  {/* 🌟 360° APPROVER AUDIT DOSSIER EXPANDED ROW */}
                                  {isExpanded && (
                                    <tr className="bg-slate-900 text-white animate-in fade-in duration-150">
                                      <td colSpan={8} className="p-5">
                                        <div className="space-y-3">
                                          <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                                            <div className="flex items-center space-x-2">
                                              <span className="text-sm">🔍</span>
                                              <span className="font-mono font-bold text-amber-300 text-xs uppercase tracking-wider">
                                                360° Approver Audit Dossier & Cryptographic Provenance ({item.case_id})
                                              </span>
                                            </div>
                                            <div className="text-[11px] font-mono text-slate-400">
                                              UETR: <strong className="text-white">{item.uetr || `UETR-${item.case_id}`}</strong>
                                            </div>
                                          </div>

                                          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs font-mono">
                                            {/* Section 1: ISO 20022 Field Mutation */}
                                            <div className="bg-slate-800/90 p-3.5 rounded-xl border border-slate-700/80 space-y-2">
                                              <div className="text-amber-300 font-bold text-[11px] flex items-center space-x-1.5">
                                                <span>📝</span>
                                                <span>ISO 20022 Field Mutation Diff</span>
                                              </div>
                                              <div className="space-y-1.5 text-[11px]">
                                                <div>
                                                  <span className="text-slate-400">XML Tag:</span>{" "}
                                                  <strong className="text-sky-300 break-all">{item.original_field || "Document.CstmrCdtTrfInitn.PmtInf.CdtTrfTxInf.CdtrAcct.Id"}</strong>
                                                </div>
                                                <div>
                                                  <span className="text-slate-400">Pre-Mutation:</span>{" "}
                                                  <span className="line-through text-rose-300 bg-rose-950/80 px-1.5 py-0.5 rounded border border-rose-800 break-all">
                                                    {item.original_value || "ORIGINAL_ERRONEOUS_DATA"}
                                                  </span>
                                                </div>
                                                <div>
                                                  <span className="text-slate-400">Post-Mutation:</span>{" "}
                                                  <span className="font-bold text-emerald-300 bg-emerald-950/80 px-1.5 py-0.5 rounded border border-emerald-800 break-all">
                                                    {item.proposed_value || item.proposed_repair_summary || "REPAIRED_DATA"}
                                                  </span>
                                                </div>
                                                <div className="text-[10px] text-slate-300 pt-1 border-t border-slate-700">
                                                  Validation Proof: {item.field_justification || item.reason}
                                                </div>
                                              </div>
                                            </div>

                                            {/* Section 2: Counterparty & Clearing Metadata */}
                                            <div className="bg-slate-800/90 p-3.5 rounded-xl border border-slate-700/80 space-y-2">
                                              <div className="text-sky-300 font-bold text-[11px] flex items-center space-x-1.5">
                                                <span>🏦</span>
                                                <span>Routing & Settlement Route</span>
                                              </div>
                                              <div className="space-y-1 text-[11px]">
                                                <div><span className="text-slate-400">Debtor:</span> <strong className="text-white">{item.debtor_name || "Apex Global Treasury (US)"}</strong></div>
                                                <div><span className="text-slate-400">Debtor BIC:</span> <span className="text-sky-300">{item.debtor_agent_bic || "CHASUS33XXX"}</span></div>
                                                <div className="pt-1 border-t border-slate-700"><span className="text-slate-400">Creditor:</span> <strong className="text-white">{item.creditor_name || "Nordhavn Components A/S"}</strong></div>
                                                <div><span className="text-slate-400">Creditor BIC:</span> <span className="text-sky-300">{item.creditor_agent_bic || "BARCGB22XXX"}</span></div>
                                                <div className="pt-1 border-t border-slate-700">
                                                  <span className="text-slate-400">Clearing Rail:</span> <span className="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-bold">{item.clearing_rail || "FEDWIRE"}</span>
                                                </div>
                                              </div>
                                            </div>

                                            {/* Section 3: Institutional Policy & Compliance */}
                                            <div className="bg-slate-800/90 p-3.5 rounded-xl border border-slate-700/80 space-y-2">
                                              <div className="text-emerald-300 font-bold text-[11px] flex items-center space-x-1.5">
                                                <span>🛡️</span>
                                                <span>Policy & Regulatory Attestation</span>
                                              </div>
                                              <div className="space-y-1 text-[11px]">
                                                <div><span className="text-slate-400">STP Rule:</span> <strong className="text-amber-300">{item.matching_rule_name || "STP Heuristic Fast-Lane"}</strong></div>
                                                <div><span className="text-slate-400">Exemption:</span> <span className="text-white">Dual-Auth Exemption &le; $25,000</span></div>
                                                <div><span className="text-slate-400">Sanctions:</span> <span className="text-emerald-400 font-bold">{item.sanctions_status || "CLEAN (0 Hits)"}</span></div>
                                                <div><span className="text-slate-400">AI Confidence:</span> <span className="text-emerald-400 font-bold">{Math.round((item.ai_confidence || 0.95) * 100)}% Verified</span></div>
                                                <div className="pt-1 border-t border-slate-700 text-[10px] text-slate-300">
                                                  Cryptographic Seal: SHA-256 Ledger Hash Chain Signed
                                                </div>
                                              </div>
                                            </div>
                                          </div>
                                        </div>
                                      </td>
                                    </tr>
                                  )}
                                </React.Fragment>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    )}

                    {/* Maker-Checker & Governance Strip */}
                    <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-3">
                      <div className="flex items-center justify-between">
                        <div className="text-xs font-bold text-slate-800 uppercase font-mono flex items-center space-x-1.5">
                          <span>🛡️</span>
                          <span>Maker-Checker Governance & Segregation of Duties</span>
                        </div>
                        <div className="text-xs font-mono">
                          Active Persona: <strong className="text-slate-900">{currentPersona.name} ({currentPersona.title})</strong>
                        </div>
                      </div>

                      {currentPersona.role === "OPERATOR" ? (
                        <div className="p-3 bg-amber-50 border border-amber-300 rounded-xl text-xs text-amber-900 space-y-1">
                          <div className="font-bold">⚠️ Segregation of Duties Active (Maker Mode)</div>
                          <p className="text-[11px] text-amber-800">
                            Operators (Makers) can inspect and filter batch candidates, but final 1-click batch settlement authorization requires an Operations Approver (Daniel Osei) or Admin.
                          </p>
                          <div className="pt-1">
                            <button
                              onClick={() => {
                                const approver = PERSONAS_CONFIG.find(p => p.role === "OPERATIONS_APPROVER");
                                if (approver) setCurrentPersona(approver);
                              }}
                              className="px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-bold shadow-xs"
                            >
                              Switch to Daniel Osei (Operations Approver) &rarr;
                            </button>
                          </div>
                        </div>
                      ) : (
                        <div className="space-y-2">
                          <div>
                            <label className="block text-[11px] font-bold text-slate-700 mb-1 font-mono uppercase">
                              Approver Batch Authorization Sign-off Comments:
                            </label>
                            <input
                              type="text"
                              value={batchReleaseComments}
                              onChange={e => setBatchReleaseComments(e.target.value)}
                              placeholder="Reason / governance note for batch settlement release..."
                              className="w-full p-2.5 bg-white border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none"
                            />
                          </div>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Modal Footer Controls */}
                  <div className="bg-slate-50 px-6 py-4 border-t border-slate-200 flex justify-between items-center text-xs">
                    <div className="font-mono text-slate-500">
                      Selected: <strong>{selectedStpCaseIds.length} Cases</strong> (${totalBatchAmount.toLocaleString(undefined, { minimumFractionDigits: 2 })} Total)
                    </div>

                    <div className="flex items-center space-x-2">
                      <button
                        onClick={() => { setStpBatchDrawerOpen(false); setBatchReleaseResult(null); setExpandedBatchCaseId(null); }}
                        className="px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 rounded-xl border font-semibold"
                      >
                        Close
                      </button>
                      {currentPersona.role !== "OPERATOR" && (
                        <button
                          onClick={handleExecuteBatchStp}
                          disabled={isBatchReleasing || selectedStpCaseIds.length === 0 || stpEligibleCases.length === 0}
                          className="px-5 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 rounded-xl font-bold shadow-md flex items-center space-x-1.5 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                          <span>{isBatchReleasing ? "Dispatching Batch Settlement..." : `⚡ Authorize & Settle ${selectedStpCaseIds.length} Payments`}</span>
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* Persona Switcher Modal */}
          {isPersonaModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-2xl overflow-hidden">
                <div className="bg-slate-900 px-6 py-5 text-white flex justify-between items-center">
                  <div>
                    <h2 className="text-lg font-semibold">Institutional Persona Switcher</h2>
                    <p className="text-xs text-slate-400">Select an authenticated banking role to test RBAC rules</p>
                  </div>
                  <button onClick={() => setIsPersonaModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="p-6 grid grid-cols-2 gap-3.5">
                  {PERSONAS_CONFIG.map(p => (
                    <div
                      key={p.user_id}
                      onClick={() => { setCurrentPersona(p); setIsPersonaModalOpen(false); }}
                      className={`p-4 rounded-xl border cursor-pointer hover:bg-slate-50 ${currentPersona.user_id === p.user_id ? "border-sky-500 bg-sky-50" : "border-slate-200"}`}
                    >
                      <div className="flex items-center justify-between">
                        <h4 className="text-sm font-semibold text-slate-900">{p.name}</h4>
                        {currentPersona.user_id === p.user_id && <span className="text-xs text-sky-600 font-bold">Active</span>}
                      </div>
                      <p className="text-xs text-slate-500 font-medium">{p.title}</p>
                      <div className="mt-2 flex justify-between text-[11px] text-slate-400 border-t pt-1.5 font-mono">
                        <span>{p.user_id}</span>
                        <span>{p.max_approval_amount > 0 ? `Limit: $${(p.max_approval_amount / 1000).toFixed(0)}k` : "Maker Only"}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Settlement Receipt Modal */}
          {settlementReceiptModalCase && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-emerald-800 px-6 py-4 text-white flex justify-between items-center">
                <div>
                  <h3 className="text-sm font-bold flex items-center space-x-1.5">
                    <span>✓ Settlement Receipt Confirmation</span>
                  </h3>
                  <p className="text-[11px] text-emerald-200">Simulated Bank Clearing Rail Acknowledgement</p>
                </div>
                <button onClick={() => setSettlementReceiptModalCase(null)} className="text-emerald-200 hover:text-white">✕</button>
              </div>

              <div className="p-6 space-y-4 text-xs">
                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2 font-mono text-[11px]">
                  <div className="flex justify-between"><span>CASE ID:</span><strong className="text-slate-900">{settlementReceiptModalCase.case_id}</strong></div>
                  <div className="flex justify-between"><span>DOMAIN:</span><strong className="text-sky-700">{settlementReceiptModalCase.domain}</strong></div>
                  <div className="flex justify-between"><span>PROFILE:</span><strong className="text-slate-900">{settlementReceiptModalCase.profile}</strong></div>
                  <div className="flex justify-between"><span>AMOUNT:</span><strong className="text-emerald-700 font-bold">{settlementReceiptModalCase.currency} {settlementReceiptModalCase.amount?.toLocaleString(undefined, { minimumFractionDigits: 2 })}</strong></div>
                  <div className="flex justify-between"><span>STATUS:</span><strong className="text-emerald-600">SETTLED_CONFIRMED</strong></div>
                  <div className="flex justify-between"><span>RECEIPT REF:</span><strong className="text-sky-700">ACK-SIM-{settlementReceiptModalCase.case_id?.replace("PEX-", "")}-001</strong></div>
                </div>
                <button
                  onClick={() => setSettlementReceiptModalCase(null)}
                  className="w-full py-2.5 bg-slate-900 text-white rounded-xl font-bold text-xs hover:bg-slate-800"
                >
                  Close Receipt
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
