<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Roof Pediment Triangle -->
  <polygon points="50,14 14,32 86,32" stroke="#F59E0B" stroke-width="4.5" stroke-linejoin="round" fill="none"/>
  <!-- Architrave Eaves -->
  <rect x="18" y="32" width="64" height="6" rx="1.5" stroke="#F59E0B" stroke-width="3.5" fill="none"/>
  <!-- 4 Pillars -->
  <line x1="28" y1="38" x2="28" y2="70" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <line x1="42" y1="38" x2="42" y2="70" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <line x1="58" y1="38" x2="58" y2="70" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <line x1="72" y1="38" x2="72" y2="70" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <!-- Stepped Base Platform -->
  <rect x="14" y="70" width="72" height="6" rx="1.5" stroke="#F59E0B" stroke-width="3.5" fill="none"/>
  <line x1="10" y1="78" x2="90" y2="78" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="6" y1="84" x2="94" y2="84" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
</svg>