  <polygon points="40,28 70,38 40,48 10,38" stroke="#00e5ff" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
  <polygon points="40,44 70,54 40,64 10,54" stroke="#00e5ff" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
