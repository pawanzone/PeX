  <polygon points="22,22 36,12 36,36 12,36" fill="#117ACA"/>
  <polygon points="58,22 68,36 44,36 44,12" fill="#117ACA"/>
  <polygon points="58,58 44,68 44,44 68,44" fill="#117ACA"/>
